name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          exporter_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          exporter_tag=latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            exporter_tag="$GITHUB_REF_NAME"
          fi
          docker build -t "$exporter_image:$exporter_tag" .
          docker push "$exporter_image:$exporter_tag"
